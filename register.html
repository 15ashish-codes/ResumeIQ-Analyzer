<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account — ResumeIQ</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="assets/style.css" rel="stylesheet"></head><body><div class="auth-wrap"><div class="auth-card"><div class="auth-logo"><a class="navbar-brand fw-bold fs-3" href="index.html"><span class="brand-mark">R</span> Resume<span>IQ</span></a><h4 class="mt-4 mb-1">Create your account</h4><p class="muted">Start improving your resume today.</p></div><form id="registerForm"><div class="row g-3"><div class="col-md-6"><label class="form-label">First name</label><input id="firstName" class="form-control" required></div><div class="col-md-6"><label class="form-label">Last name</label><input id="lastName" class="form-control" required></div><div class="col-12"><label class="form-label">Email</label><input id="email" type="email" class="form-control" required></div><div class="col-12"><label class="form-label">Role</label><select id="role" class="form-select"><option value="student">Student</option><option value="recruiter">Recruiter</option></select></div><div class="col-md-6"><label class="form-label">Password</label><input id="password" type="password" class="form-control" minlength="8" required></div><div class="col-md-6"><label class="form-label">Confirm</label><input id="confirm" type="password" class="form-control" minlength="8" required></div></div><div class="form-check mt-3 mb-3"><input class="form-check-input" type="checkbox" required id="terms"><label class="form-check-label small" for="terms">I agree to the terms and privacy policy.</label></div><button class="btn btn-primary w-100 py-2">Create Account</button></form><div class="text-center mt-4 small text-secondary">Already registered? <a href="login.html">Login</a></div></div></div><script src="assets/app.js"></script></body></html>
